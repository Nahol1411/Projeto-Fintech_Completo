<!DOCTYPE html>
<html lang="br" class="h-full overflow-y-auto">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tibar</title>
  <link href="/css/main-style.css" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="/images/tibar-logo_branca.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen w-full overflow-x-hidden font-urbanist text-[24px]">

  <div class="relative min-h-screen w-full bg-(--preto) theme-cadastro md:bg-page-container">

   <div class="bg-gradient-overlay"> </div>

   <div class="content-layer flex w-full justify-center md:justify-start items-center shrink-0 px-6 md:px-0 md:ml-[50px] pt-6 md:pt-[25px] md:pl-[50px] gap-[15px]">
    <img class="w-[100px] h-[100px]" src="/images/tibar-logo_branca.png" alt="Logo da Tibar">
    <h1 class="text-(--branco) text-[48px] md:text-[64px]">Tibar</h1>
  </div>
    <section class="content-layer flex flex-col justify-normal mx-auto gap-[15px] px-6 md:px-0">

        <h2 class="text-(--branco) text-[32px] md:text-[48px] pt-[25px] text-center">Cadastre-se!</h2>

    <div class="flex flex-col md:flex-row md:gap-[100px] md:ml-[200px] pt-[70px] items-center">
       <div class="content-layer flex flex-col md:flex-row justify-between md:gap-[100px] w-full md:w-[1200px] shrink-0 gap-[40px] md:gap-0">
        <form class="flex flex-col justify-center md:gap-[15px] w-full md:w-[100%] mx-auto md:mx-0" th:action="@{/cadastro}" method="post">
        <div class="flex flex-col justify-center w-full md:w-[100%] mx-auto md:mx-0 md:gap-[60px] gap-[30px]">
        <div  class="flex flex-col md:flex-row justify-between gap-[30px] md:gap-[15px]">

            <div class="flex gap-[5px] w-full md:w-1/2">
                <input id="cad-nome" class="campo_input pr-0 w-full max-w-full md:max-w-[210px]" type="text" name="nome" placeholder="Digite seu nome" required>
            </div>
            <div class="flex gap-[5px] w-full md:w-1/2">
                <input id="cad-sobrenome" class="campo_input pr-0 w-full max-w-full md:max-w-[260px]" type="text" name="sobrenome" placeholder="Digite seu sobrenome" required>
            </div>
         </div>

        <input id="cad-email" class="campo_input w-full" type="email" name="email" placeholder="Digite seu email" required>
        <input id="cad-senha" class="campo_input w-full" type="password" name="senha" placeholder="Pelo menos 8 caracteres" required>
        <input id="cad-confirmarSenha" class="campo_input w-full" type="password" name="confirmarSenha" placeholder="Confirme sua senha" required>
    </div>
        <label for="cad-termos" class="flex items-center gap-[10px] pt-[15px]">
            <input id="cad-termos" class="form-checkbox" type="checkbox" name="termos" required>
            <span class="text-(--branco)">Eu li e concordo com os termos de serviço</span>
        </label>

            <div class="flex flex-col sm:flex-row justify-between pt-[35px] gap-4">
                <button class="w-full sm:w-[45%] md:w-full py-[7.5px] bg-(--ciano) text-(--preto) border-solid border-[2px] border-(--branco) rounded-[15px] hover:bg-(--branco) hover:text-(--preto) hover:border-(--preto)" type="submit">Criar conta</button>
            </div>
            <p class="text-(--branco) pt-[15px]">Já possui uma conta?<a class="text-(--branco) hover:text-(--ciano) pl-[15px]" href="/login">Login</a></p>
        </form>
          <div class="flex flex-col content-layer md:pt-[120px] md:pl-[50px] md:border-l-[thin] md:border-[white] md:gap-[40px] gap-[20px] w-full">
             <button class="campo_input w-full pr-[15px] flex items-center justify-center mb-[20px] hover:bg-(--cinza_principal)" type="button" onclick="window.location.href='/login/google'">
                  <img class="inline-block w-[40px] h-[40px] mr-[10px]" src="/images/logo_google.svg" alt="Logo do Google">
                   Entrar com uma conta Google
             </button>

        <button class="campo_input w-full pr-[15px] flex items-center justify-center mb-[20px] hover:bg-(--cinza_principal)" type="button" onclick="window.location.href='/login/microsoft'">
          <img class="inline-block w-[40px] h-[40px] mr-[10px]" src="/images/logo_microsoft.svg" alt="Logo do Microsoft">
          Entrar com uma conta Microsoft
        </button>
        </div>
    </div>
  </section>
</div>
</body>
</html>
